<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Knight Quest</title>
<style>
:root{--bg:#10102a;--ink:#fff;--gold:#ffd24a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Courier New",monospace;overflow:hidden;touch-action:none;user-select:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#stage{position:relative;height:min(100%,640px);aspect-ratio:2/3;max-width:100%}
canvas{width:100%;height:100%;display:block;border:4px solid var(--gold)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:rgba(16,16,42,.9);gap:14px;overflow:hidden}
.hidden{display:none!important}
h1{margin:0;color:var(--gold);font-size:2rem;text-shadow:3px 3px #b3261e;line-height:1.1}
p{margin:0;line-height:1.5}
button{font:inherit;font-weight:bold;font-size:1.1rem;padding:12px 22px;background:var(--gold);border:3px solid #fff;color:#222;cursor:pointer;box-shadow:4px 4px #000;touch-action:manipulation}
button:active{transform:translate(2px,2px)}
.blink{animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:.4}}
#apology{background:#3a1040}
#line{font-size:1.05rem;color:#ffe6f0;max-width:300px;min-height:3em}
#q{font-size:1.6rem;color:#fff;font-weight:bold;text-shadow:2px 2px #b3261e}
#arena{position:relative;width:100%;height:150px}
#arena button{position:absolute;transition:left .25s,top .25s,transform .25s}
#yes{left:calc(50% - 70px);top:20px;background:#ff6b9d}
#no{left:calc(50% - 40px);top:90px;background:#ddd}
.fl{position:absolute;bottom:-30px;animation:up linear forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-700px);opacity:0}}
.conf{position:absolute;top:-30px;animation:dn linear forwards;pointer-events:none}
@keyframes dn{to{transform:translateY(700px) rotate(540deg)}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<canvas id="c" width="360" height="540"></canvas>

<div id="title" class="screen">
  <div style="font-size:3rem">🏰</div>
  <h1>SUPER KNIGHT QUEST</h1>
  <p>The evil dragon kidnapped the Princess!<br>Collect <b>15 points</b> to rescue her.</p>
  <p style="font-size:.9rem">❤️ +1 &nbsp; 🌟 +3 &nbsp; 🛡️ shield<br>🔥 = ouch &nbsp; Chain hearts for COMBOS!</p>
  <p style="font-size:.8rem;opacity:.8">Drag / arrow keys to move</p>
  <button id="start" class="blink">PRESS START</button>
</div>

<div id="over" class="screen hidden">
  <h1>GAME OVER</h1><p>CONTINUE?</p><button id="cont">YES</button>
</div>

<div id="boss" class="screen hidden">
  <div id="bi" style="font-size:3.5rem">🏆</div>
  <h1 id="bt">LEVEL CLEAR!</h1><p id="bp"></p>
</div>

<div id="apology" class="screen hidden">
  <p id="line"></p>
  <div id="qbox" class="hidden" style="width:100%">
    <p id="q">Will you forgive me? 🥺</p>
    <div id="arena"><button id="yes">Yes 💖</button><button id="no">No</button></div>
  </div>
</div>
</div></div>

<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const $=id=>document.getElementById(id);
const GOAL=15;
let state='title',score=0,lives=3,px=180,tx=180,items=[],parts=[],pops=[],t=0,keys={},combo=0,shield=0,shake=0,dx=180,dv=1.2,level=1;
let ac;
function beep(f,d=.1,type='square',v=.05){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;
 o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function show(id){['title','over','boss','apology'].forEach(s=>$(s).classList.toggle('hidden',s!==id))}
function hide(){show('')}
function burst(px_,py,emoji,n=8){for(let i=0;i<n;i++)parts.push({x:px_,y:py,vx:(Math.random()-.5)*6,vy:-Math.random()*5-1,l:30,e:emoji})}

function spawn(){
  const r=Math.random();
  const o={x:20+Math.random()*320,y:-20,v:1.8+Math.random()*1.2+score*.09};
  if(r<.5)o.k='h'; else if(r<.62)o.k='s'; else if(r<.7)o.k='p'; else{o.k='f';o.x=dx;o.y=60;o.vx=(Math.random()-.5)*1.6}
  items.push(o);
}
function update(){
  if(state!=='play')return;
  t++;level=1+Math.floor(score/5);
  if(keys.ArrowLeft||keys.a)tx-=6;
  if(keys.ArrowRight||keys.d)tx+=6;
  tx=Math.max(24,Math.min(336,tx));px+=(tx-px)*.3;
  dx+=dv*(1+level*.3);if(dx>320||dx<40)dv=-dv;
  if(t%Math.max(18,40-level*6)===0)spawn();
  for(const i of items){
    i.y+=i.v;if(i.vx)i.x+=i.vx;
    if(Math.abs(i.x-px)<26&&Math.abs(i.y-478)<30&&!i.dead){
      i.dead=true;
      if(i.k==='h'||i.k==='s'){
        combo++;const m=1+Math.floor(combo/5);const pts=(i.k==='s'?3:1)*m;score+=pts;
        pops.push({x:px,y:440,t:'+'+pts+(m>1?' x'+m:''),l:40});burst(i.x,i.y,i.k==='s'?'✨':'💖',5);
        beep(600+Math.min(combo,12)*50,.1,'triangle');
        if(score>=GOAL)return win();
      }else if(i.k==='p'){shield=1;beep(900,.2,'sine');burst(i.x,i.y,'🛡️',4)}
      else{
        if(shield){shield=0;beep(300,.15,'sawtooth');burst(px,470,'💥',4)}
        else{lives--;combo=0;shake=12;beep(120,.3,'sawtooth',.08);burst(px,470,'💥',8);
          if(lives<=0){state='over';show('over')}}
      }
    }
  }
  items=items.filter(i=>!i.dead&&i.y<570);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.l--});parts=parts.filter(p=>p.l>0);
  pops.forEach(p=>{p.y--;p.l--});pops=pops.filter(p=>p.l>0);
  if(shake>0)shake--;
}
function draw(){
  x.save();
  if(shake>0)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const g=x.createLinearGradient(0,0,0,540);
  const night=level>=3;
  g.addColorStop(0,night?'#2b1b5a':level===2?'#ff9a6b':'#5ec8ff');g.addColorStop(1,night?'#6a4ca8':level===2?'#ffe0b8':'#c9f0ff');
  x.fillStyle=g;x.fillRect(-10,-10,380,560);
  x.textAlign='center';x.font='40px serif';
  x.fillText(night?'🌙':'☁️',60+(t*.2)%260,90);x.fillText(night?'⭐':'☁️',280-(t*.1)%200,150);
  x.fillStyle=night?'#2a5a2a':'#3a9d3a';x.fillRect(-10,510,380,40);
  x.font='54px serif';x.fillText(level>=3?'🐲':'🐉',dx,56);
  x.font='34px serif';
  for(const i of items)x.fillText({h:'❤️',s:'🌟',p:'🛡️',f:'🔥'}[i.k],i.x,i.y);
  x.font='42px serif';x.fillText('🤺',px,508);
  if(shield){x.strokeStyle='#4fd1ff';x.lineWidth=3;x.beginPath();x.arc(px,488,30,0,7);x.stroke()}
  x.font='20px serif';for(const p of parts)x.fillText(p.e,p.x,p.y);
  x.font='bold 18px "Courier New"';x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=3;
  for(const p of pops){x.strokeText(p.t,p.x,p.y);x.fillText(p.t,p.x,p.y)}
  x.fillStyle='#222';x.textAlign='left';x.font='bold 15px "Courier New"';
  x.fillText('SCORE '+score+'/'+GOAL+'  LV'+level,10,531);
  x.textAlign='right';x.fillText((combo>1?'COMBO '+combo+'  ':'')+'♥'.repeat(Math.max(lives,0)),350,531);
  x.fillStyle='rgba(0,0,0,.2)';x.fillRect(0,0,360*score/GOAL,6);
  x.restore();
}
(function loop(){update();draw();requestAnimationFrame(loop)})();

function reset(){score=0;lives=3;items=[];parts=[];t=0;combo=0;shield=0}
$('start').onclick=()=>{reset();state='play';hide();beep(500,.1);beep(800,.2)};
$('cont').onclick=()=>{lives=3;items=[];combo=0;state='play';hide()};

function win(){
  state='boss';items=[];show('boss');[500,650,800,1000].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*120));
  setTimeout(()=>{$('bp').textContent='The Princess is in another cast—'},1500);
  setTimeout(()=>{$('bi').textContent='🐉';$('bt').textContent='WARNING!';$('bp').textContent='FINAL BOSS APPROACHING...';beep(100,.8,'sawtooth',.08)},3200);
  setTimeout(()=>{$('bi').textContent='';$('bt').textContent='';$('bp').textContent='...'},5000);
  setTimeout(apology,6200);
}

const lines=[
 "Okay... the game was a trick. 🎮",
 "There's no dragon. There's no princess to save.",
 "There's just me, and I messed up.",
 "I'm sorry. Not a \"sorry you're upset\" kind of sorry. Actually sorry for how I made you feel.",
 "I should have listened better, and I'm going to do better.",
 "You mean more to me than winning any argument... or any game."
];
function apology(){
  show('apology');const box=$('apology'),el=$('line');
  setInterval(()=>{const f=document.createElement('div');f.className='fl';f.textContent=['💖','💕','✨'][Math.random()*3|0];
    f.style.left=Math.random()*90+'%';f.style.fontSize=(18+Math.random()*20)+'px';f.style.animationDuration=(4+Math.random()*3)+'s';
    box.appendChild(f);setTimeout(()=>f.remove(),7000)},350);
  let li=0;
  (function next(){
    if(li>=lines.length){el.textContent='';$('qbox').classList.remove('hidden');return}
    const s=lines[li++];let c=0;el.textContent='';
    const iv=setInterval(()=>{el.textContent=s.slice(0,++c);if(c>=s.length){clearInterval(iv);setTimeout(next,1400)}},45);
  })();
}

let dodges=0;const no=$('no'),yes=$('yes');
const taunts=['No','Are you sure? 🥺','Nope, wrong button','Try again 😏','Obviously yes 💖'];
function dodge(e){
  if(dodges>=4)return;
  e.preventDefault();e.stopPropagation();
  dodges++;no.textContent=taunts[dodges];
  const ar=$('arena');
  no.style.left=Math.random()*(ar.clientWidth-no.offsetWidth)+'px';
  no.style.top=Math.random()*(ar.clientHeight-no.offsetHeight)+'px';
  yes.style.transform='scale('+(1+dodges*.2)+')';
  beep(300+dodges*80,.08);
  if(dodges>=4){no.style.background='#ff6b9d';no.style.transform='scale(1.2)'}
}
no.addEventListener('pointerdown',dodge);
no.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')dodge(e)});
function celebrate(){
  const box=$('apology');
  $('qbox').classList.add('hidden');
  $('line').innerHTML='<span style="font-size:3rem">🏆</span><br><b style="color:#ffd24a;font-size:1.5rem">FORGIVENESS UNLOCKED!</b><br><br>Player 2 is back in the game. 💖<br><br><span style="font-size:.9rem">Reward: one extra-long hug,<br>and you pick what we do next.</span>';
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2,'triangle',.07),i*140));
  for(let i=0;i<60;i++)setTimeout(()=>{const c=document.createElement('div');c.className='conf';
    c.textContent=['🎉','💖','✨','🎊','💕'][i%5];c.style.left=Math.random()*95+'%';c.style.fontSize=(20+Math.random()*18)+'px';
    c.style.animationDuration=(2.5+Math.random()*2)+'s';box.appendChild(c);setTimeout(()=>c.remove(),5000)},i*60);
}
yes.onclick=celebrate;
no.onclick=()=>{if(dodges>=4)celebrate()};

addEventListener('keydown',e=>keys[e.key]=true);
addEventListener('keyup',e=>keys[e.key]=false);
function move(e){const r=cv.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*360}
cv.addEventListener('pointermove',move);cv.addEventListener('pointerdown',move);
</script>
</body>
</html>
